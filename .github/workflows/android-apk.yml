# Builds the Android app on Expo's servers. Run it from the GitHub "Actions"
# tab ("Run workflow") and pick a profile:
#   preview    - an APK to install directly on test phones
#   production - the AAB to upload to Google Play
# The finished build appears on expo.dev under the cognicare project.
#
# Needs one repository secret, EXPO_TOKEN (expo.dev → Account settings →
# Access tokens). The backend is built separately (api-image.yml).
name: Android build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        type: choice
        options: [preview, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cognicare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cognicare/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
